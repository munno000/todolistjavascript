<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDoList</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      padding: 32px;
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 24px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus {
      border-color: #4f46e5;
    }

    button.add-btn {
      padding: 10px 18px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button.add-btn:hover {
      background: #4338ca;
    }

    ul {
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    li:last-child {
      border-bottom: none;
    }

    li input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #4f46e5;
      cursor: pointer;
      flex-shrink: 0;
    }

    li span {
      flex: 1;
      font-size: 15px;
      color: #1a1a1a;
    }

    li.done span {
      text-decoration: line-through;
      color: #aaa;
    }

    li button.delete-btn {
      background: none;
      border: none;
      color: #ccc;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      transition: color 0.15s;
      padding: 2px 4px;
    }

    li button.delete-btn:hover {
      color: #ef4444;
    }

    .empty {
      text-align: center;
      color: #bbb;
      font-size: 14px;
      padding: 24px 0;
    }

    .io-row {
      display: flex;
      gap: 8px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #f0f0f0;
    }

    .io-row button {
      flex: 1;
      padding: 9px 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    button.export-btn {
      background: #f5f5f5;
      color: #444;
      border: 1.5px solid #ddd;
    }

    button.export-btn:hover {
      background: #ececec;
    }

    button.import-btn {
      background: #f5f5f5;
      color: #444;
      border: 1.5px solid #ddd;
    }

    button.import-btn:hover {
      background: #ececec;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ToDoList</h1>
    <div class="input-row">
      <input type="text" id="todoInput" placeholder="新しいタスクを入力..." />
      <button class="add-btn" onclick="addTodo()">追加</button>
    </div>
    <ul id="todoList"></ul>
    <p class="empty" id="emptyMsg">タスクがありません</p>
    <div class="io-row">
      <button class="export-btn" onclick="exportTodos()">エクスポート</button>
      <button class="import-btn" onclick="document.getElementById('importInput').click()">インポート</button>
      <input type="file" id="importInput" accept=".json" style="display:none" onchange="importTodos(event)" />
    </div>
  </div>

  <script>
    let todos = JSON.parse(localStorage.getItem('todos') || '[]');

    function save() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function render() {
      const list = document.getElementById('todoList');
      const emptyMsg = document.getElementById('emptyMsg');

      list.innerHTML = '';
      emptyMsg.style.display = todos.length === 0 ? 'block' : 'none';

      todos.forEach((todo, index) => {
        const li = document.createElement('li');
        if (todo.done) li.classList.add('done');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.done;
        checkbox.onchange = () => toggle(index);

        const span = document.createElement('span');
        span.textContent = todo.text;

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '×';
        deleteBtn.onclick = () => remove(index);

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(deleteBtn);
        list.appendChild(li);
      });
    }

    function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text, done: false });
      input.value = '';
      save();
      render();
    }

    function toggle(index) {
      todos[index].done = !todos[index].done;
      save();
      render();
    }

    function remove(index) {
      todos.splice(index, 1);
      save();
      render();
    }

    function exportTodos() {
      const blob = new Blob([JSON.stringify(todos, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'todos.json';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function importTodos(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (!Array.isArray(imported)) throw new Error();
          todos = imported;
          save();
          render();
        } catch {
          alert('JSONファイルの形式が正しくありません');
        }
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    document.getElementById('todoInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) addTodo();
    });

    render();
  </script>
</body>
</html>
